<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pijamoon — pijamas para noites aconchegantes</title>
  <meta name="description" content="Pijamoon: pijamas de frio e de calor para noites aconchegantes, sob a luz da lua.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">
      <img src="img/logo.png" alt="Pijamoon" class="logo-img">
    </a>
    <nav>
      <a href="como-fiz/index.html">Como fiz</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Pijamas pra quem dorme sonhando</h1>
      <p>Pijamas de frio e de calor pra toda noite ser aconchegante.</p>
    </section>

    <section class="loja" aria-label="Catálogo de produtos">
      <div class="controls">
        <input type="search" id="busca" placeholder="Buscar pijama..." aria-label="Buscar produto">

        <select id="categoria" aria-label="Filtrar por categoria">
          <option value="todas">Todas as categorias</option>
          <!-- demais opções inseridas via JS, a partir das categorias presentes em data/products.json -->
        </select>
      </div>

      <p id="status" role="status"></p>

      <div id="produtos" class="grid" aria-live="polite">
        <p class="carregando">Carregando produtos…</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pijamoon — Desafio Bootcamp AI/R</p>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
