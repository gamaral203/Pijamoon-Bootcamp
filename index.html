<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pijamoon — pijamas para noites aconchegantes</title>
  <meta name="description" content="Pijamoon: pijamas de alcinha, americano, camisa e camisola para noites aconchegantes, sob a luz da lua.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-top">
      <a href="index.html" class="logo" aria-label="Pijamoon — página inicial">
        <svg class="logo-svg" viewBox="0 0 230 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <circle cx="6" cy="8" r="1.6" fill="#E8C878"/>
          <circle cx="49" cy="6" r="1.3" fill="#E8C878"/>
          <circle cx="47" cy="44" r="1.5" fill="#E8C878"/>
          <path d="M42 26 A18 18 0 1 1 22 7 A14 14 0 0 0 42 26 Z" fill="#E8C878"/>
          <text x="62" y="37" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#3B5478">Pijamoon</text>
        </svg>
      </a>

      <div class="header-centro">
        <div class="header-busca">
          <input type="search" id="busca" placeholder="Buscar pijama..." aria-label="Buscar produto">
        </div>

        <div class="categorias-dropdown" id="categoriasDropdown">
          <button type="button" class="categorias-trigger" id="categoriasTrigger" aria-haspopup="true" aria-expanded="false">
            Categorias
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="categorias-menu" id="categoriasMenu" role="menu" aria-label="Categorias">
            <button type="button" class="categoria-link ativo" data-categoria="todas" role="menuitem">Todas</button>
            <!-- demais categorias inseridas via JS, a partir das categorias presentes em data/products.json -->
          </div>
        </div>
      </div>

      <div class="header-direita">
        <button type="button" class="icone-header" disabled title="Login (em breve)" aria-label="Login (em breve)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
        <button type="button" class="icone-header" disabled title="Carrinho (em breve)" aria-label="Carrinho (em breve)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </button>
        <nav>
          <a href="como-fiz/index.html">Como fiz</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Aconchego pra toda noite de sono</h1>
      <p>Do alcinha ao americano, um jeito pra cada noite.</p>
    </section>

    <section class="loja" aria-label="Catálogo de produtos">
      <p id="status" role="status"></p>

      <div id="produtos" class="grid" aria-live="polite">
        <p class="carregando">Carregando produtos…</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pijamoon — Desafio Bootcamp AI/R</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modalNome">
      <button type="button" class="modal-fechar" id="modalFechar" aria-label="Fechar">&times;</button>

      <div class="produto-imagem-wrapper modal-imagem-wrapper">
        <img id="modalImagem" src="" alt="" class="produto-imagem">

        <button type="button" class="btn-alternar-foto btn-anterior" id="modalBtnAnterior" hidden aria-label="Foto anterior" title="Foto anterior">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 6 9 12 15 18"></polyline>
          </svg>
        </button>
        <button type="button" class="btn-alternar-foto btn-proxima" id="modalBtnProxima" hidden aria-label="Próxima foto" title="Próxima foto">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"></polyline>
          </svg>
        </button>

        <div class="produto-fotos-dots" id="modalDots" hidden aria-hidden="true">
          <span class="dot ativo"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="modal-info">
        <span class="produto-categoria" id="modalCategoria"></span>
        <h2 id="modalNome"></h2>
        <p class="produto-descricao" id="modalDescricao"></p>
        <p class="produto-preco" id="modalPreco"></p>
      </div>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
