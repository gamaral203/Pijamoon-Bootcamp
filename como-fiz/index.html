<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como fiz — Pijamoon</title>
  <meta name="description" content="Bastidores da loja Pijamoon: como foi construída, hospedada e o que ficaria pra próxima versão.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z' fill='%23E8C878'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">

  <script>
    (function () {
      if (localStorage.getItem("pijamoon_tema") === "escuro") {
        document.documentElement.dataset.tema = "escuro";
      }
    })();
  </script>
</head>
<body>

  <!--
    Única página do site que não tem TS próprio — não precisa de nada
    interativo além do botão de tema, então em vez de criar um "como-fiz.ts"
    só pra isso, ela chama a função direto num scriptzinho aqui embaixo
    (ver perto de </body>).
  -->
  <header class="site-header">
    <div class="site-header-top">
      <a href="../index.html" class="logo" aria-label="Pijamoon — página inicial">
        <svg class="logo-svg" viewBox="0 0 230 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <circle cx="6" cy="8" r="1.6" fill="#E8C878"/>
          <circle cx="49" cy="6" r="1.3" fill="#E8C878"/>
          <circle cx="47" cy="44" r="1.5" fill="#E8C878"/>
          <path d="M42 26 A18 18 0 1 1 22 7 A14 14 0 0 0 42 26 Z" fill="#E8C878"/>
          <text x="62" y="37" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#3B5478">Pijamoon</text>
        </svg>
      </a>
      <div class="header-centro"></div>

      <div class="header-direita">
        <button type="button" class="icone-header" id="botaoTema" title="Modo escuro" aria-label="Modo escuro">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
        </button>
        <nav>
          <a href="../index.html">Voltar pra loja</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="loja">
    <!-- classe "hero" (não "hero-carrossel"!) — é o hero simples de texto,
         usado só em páginas secundárias; ver a nota no topo de css/style.css
         sobre a diferença entre as duas classes -->
    <section class="hero">
      <h1>Como eu fiz a Pijamoon</h1>
      <p>Organização do código, headless commerce, AWS/cache, Lighthouse e onde entraria IA.</p>
    </section>

    <section aria-label="Vídeo explicativo">
      <!--
        Vídeo embutido aqui (YouTube não listado ou Loom).
        Trocar o src abaixo pelo link de embed do vídeo quando estiver pronto.
      -->
      <div class="video-wrapper">
        <iframe
          src=""
          title="Como eu fiz a Pijamoon"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pijamoon — Desafio Bootcamp AI/R</p>
  </footer>

  <script src="../js/shared.js" defer></script>
  <script>
    /* "defer" só funciona em <script src>, não em inline — por isso a
       chamada fica dentro de uma função, resolvida só quando o evento
       disparar (depois do shared.js, que é deferred, já ter rodado) */
    document.addEventListener("DOMContentLoaded", function () {
      atualizarBotaoTema();
    });
  </script>
</body>
</html>
