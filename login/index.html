<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Pijamoon</title>
  <meta name="description" content="Entre na sua conta Pijamoon pra finalizar a compra.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z' fill='%23E8C878'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">

  <script>
    (function () {
      if (localStorage.getItem("pijamoon_tema") === "escuro") {
        document.documentElement.dataset.tema = "escuro";
      }
    })();
  </script>
</head>
<body>

  <!-- mesmo cabeçalho das outras páginas internas (ver produto/index.html) -->
  <header class="site-header">
    <div class="site-header-top">
      <a href="../index.html" class="logo" aria-label="Pijamoon — página inicial">
        <svg class="logo-svg" viewBox="0 0 230 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <circle cx="6" cy="8" r="1.6" fill="#E8C878"/>
          <circle cx="49" cy="6" r="1.3" fill="#E8C878"/>
          <circle cx="47" cy="44" r="1.5" fill="#E8C878"/>
          <path d="M42 26 A18 18 0 1 1 22 7 A14 14 0 0 0 42 26 Z" fill="#E8C878"/>
          <text x="62" y="37" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#3B5478">Pijamoon</text>
        </svg>
      </a>
      <div class="header-centro"></div>

      <div class="header-direita">
        <button type="button" class="icone-header" id="botaoTema" title="Modo escuro" aria-label="Modo escuro">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
        </button>
        <button type="button" class="icone-header" id="botaoConta" title="Entrar" aria-label="Entrar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
        <span class="conta-nome" id="contaNome" hidden></span>
        <a href="../carrinho/index.html" class="icone-header" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="badge-carrinho" id="badgeCarrinho" hidden>0</span>
        </a>
        <nav>
          <a href="../index.html">Voltar pra loja</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="login-pagina">
    <!--
      Formulário simulado: o submit (ver ts/login.ts) não valida a senha
      contra nada — só confere se nome e e-mail foram preenchidos, salva os
      dois no localStorage e manda pra "próxima página" (ver o parâmetro
      "next" na URL, usado quando o carrinho/checkout mandam pra cá).
    -->
    <form class="login-caixa" id="formLogin">
      <h1>Entrar</h1>
      <p class="login-aviso">
        Login simulado pra fins do desafio — fica salvo só no seu navegador, sem servidor nem senha real por trás.
      </p>

      <!-- só aparece se já tiver alguém logado quando a página carrega -->
      <p class="login-ja-logado" id="avisoJaLogado" hidden></p>

      <label class="login-campo">
        Nome
        <input type="text" id="campoNome" name="nome" required autocomplete="name">
      </label>

      <label class="login-campo">
        E-mail
        <input type="email" id="campoEmail" name="email" required autocomplete="email">
      </label>

      <!-- existe pra parecer um login de verdade, mas não é lida/validada em lugar nenhum do código -->
      <label class="login-campo">
        Senha
        <input type="password" id="campoSenha" name="senha" required autocomplete="current-password">
      </label>

      <button type="submit" class="login-botao">Entrar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Pijamoon — Desafio Bootcamp AI/R</p>
  </footer>

  <!-- cliente do Supabase via CDN — precisa vir antes do shared.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/shared.js" defer></script>
  <script src="../js/login.js" defer></script>
</body>
</html>
